[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-office-collector"
version = "0.1.0"
description = "Read-only status exporter + outbound relay for AI Office (Hermes Agent dashboard)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
relay = ["websockets==15.0.1"]
dev = ["pytest>=8", "ruff>=0.6", "websockets==15.0.1"]

[project.scripts]
ai-office-collector = "ai_office_collector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
