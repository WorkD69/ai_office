# AI Office collector configuration (example).
# Copy to config.toml (git-ignored) or /etc/ai-office/collector.toml on the server,
# then replace the roster below with your own agents and units.

[collector]
# Isolated mode (default, installed by deploy/install.sh): office-status.service projects the
# few needed fields of Hermes state into /run/ai-office-metrics, which the exporter sees
# read-only at this path. Neither process can open the Hermes data directory.
hermes_home = "/run/ai-office-input"
# false = isolated mode: no session databases, so no "working" status and no token usage.
# Full mode (deploy/full-mode/) sets this to true and points hermes_home at the real data dir.
read_session_state = false
output = "/run/agent-office/snapshot.json"
# Optional session projection (deploy/office-status.d/session-projection.conf.example):
# the projection reads state.db from here and gives the exporter working status + usage.
# session_source = "/opt/hermes-platform/data"
# work_dir = "/run/ai-office-metrics/.work"
# Optional; written by deploy/quota-probe.sh (install with --with-quota).
quota_file = "/run/agent-office-quota/quota.json"
interval_seconds = 5
# Hermes refreshes gateway_state.json about every 30 s; older than this = offline.
gateway_stale_seconds = 180
# "Usage today" resets at local midnight in this IANA time zone (system time if omitted).
timezone = "UTC"

# ---- Desk occupants -------------------------------------------------------
# source = "hermes":  a Hermes profile (status from gateway_state.json + state.db)
# source = "systemd": a script or bot (status from `systemctl is-active`)

[[agents]]
id = "coordinator"
name = "Coordinator"
role = "Main assistant, single entry point from Telegram"
room = "hq"
kind = "llm"
source = "hermes"
profile = "default"
# Sessions opened by other services through the API/broker are not "the coordinator working".
exclude_sources = ["tool"]

[[agents]]
id = "scout"
name = "Scout"
role = "Finds opportunities on a schedule"
room = "opportunities"
kind = "llm"
source = "hermes"
profile = "scout"

[[agents]]
id = "trading-analyst"
name = "Trading Analyst"
role = "Tracks trade ideas (script + LLM broker)"
room = "trading"
kind = "worker"
source = "systemd"
units = ["trading-signals.service", "llm-broker.service"]

[[agents]]
id = "community-bot"
name = "Community Bot"
role = "Telegram community helper"
room = "community"
kind = "worker"
source = "systemd"
units = ["community-bot@prod.service"]

[[agents]]
id = "news-worker"
name = "News Worker"
role = "Collects community news"
room = "community"
kind = "worker"
source = "systemd"
units = ["news-worker.service"]

[host]
services = ["docker.service"]
